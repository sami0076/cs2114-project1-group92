services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - taskeasy-data:/data
    ports:
      - "${BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-8090}:80"

volumes:
  taskeasy-data:
