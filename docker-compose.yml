services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - taskeasy-data:/data
    networks:
      - taskeasy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-8090}:80"
    networks:
      - taskeasy

volumes:
  taskeasy-data:

networks:
  taskeasy:
    driver: bridge
